<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>问鼎 · Ding · 多股实时盯盘</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1220'/%3E%3Cpath d='M6 22 L12 15 L17 18 L26 8' stroke='%23f5a623' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='26' cy='8' r='2.6' fill='%23f5a623'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0b1220;
    --panel: #111a2c;
    --panel-2: #16223a;
    --panel-hover: #1c2b48;
    --line: rgba(148, 173, 214, 0.14);
    --text: #e8eefb;
    --text-dim: #8fa3c3;
    --text-faint: #5f7396;
    --up: #ff5d5d;
    --down: #17c98f;
    --accent: #f5a623;
    --accent-soft: rgba(245, 166, 35, 0.14);
    --ok: #2fd189;
    --danger: #ff4757;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 500px at 50% -10%, #14203a 0%, var(--bg) 55%);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 13px;
    line-height: 1.5;
    min-height: 100vh;
    padding: 20px clamp(12px, 3vw, 32px) 40px;
  }
  .num { font-variant-numeric: tabular-nums; font-family: Bahnschrift, "DIN Alternate", Consolas, "Segoe UI", sans-serif; }
  .wrap { max-width: 1120px; margin: 0 auto; }

  /* 顶部导航与设置工具条 */
  .head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .logo { width: 30px; height: 30px; flex: 0 0 30px; }
  .brand h1 { font-size: 18px; font-weight: 600; letter-spacing: 0.5px; }
  .brand small { display: block; color: var(--text-faint); font-size: 11px; font-weight: 400; margin-top: 1px; }
  .head-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

  .setting-item { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-faint); }
  .setting-item select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 8px; font-size: 12px; outline: none; cursor: pointer;
  }
  .setting-item.volume-group { gap: 8px; }
  .setting-item input[type="range"] {
    width: 76px; height: 5px; accent-color: var(--accent); cursor: pointer;
    vertical-align: middle;
  }
  #volumeVal { color: var(--text); min-width: 32px; font-weight: 500; }

  .status-pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 12px; border-radius: 999px; font-size: 12px;
    border: 1px solid var(--line); color: var(--text-dim); background: rgba(148,173,214,.06);
  }
  .status-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); }
  .status-pill.on .dot { background: var(--ok); box-shadow: 0 0 8px rgba(47,209,137,.8); }
  .status-pill.on { color: #bfe8d6; border-color: rgba(47,209,137,.4); }
  .status-pill.triggered .dot { background: var(--danger); box-shadow: 0 0 10px var(--danger); }
  .status-pill.triggered { color: #ff9f9f; border-color: rgba(255,71,87,.5); background: rgba(255,71,87,.1); animation: pill-pulse 1s infinite alternate; }
  @keyframes pill-pulse { 0% { opacity: 0.85; } 100% { opacity: 1; } }

  /* 通用卡片容器 */
  .card {
    background: linear-gradient(180deg, var(--panel) 0%, rgba(17,26,44,.7) 100%);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 16px;
  }

  /* 添加表单 */
  .add-bar { display: grid; grid-template-columns: 1.6fr 1fr 1fr auto; gap: 12px; align-items: end; }
  .field { position: relative; }
  .field label { display: block; font-size: 11px; color: var(--text-faint); margin-bottom: 6px; letter-spacing: 0.3px; }
  .field input, .field select {
    width: 100%; height: 38px; padding: 0 12px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; font-size: 13px;
    outline: none; transition: border-color .15s;
  }
  .field input:focus, .field select:focus { border-color: rgba(245,166,35,.55); }
  .field input::placeholder { color: var(--text-faint); }
  .suggest {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 40;
    background: #0e1830; border: 1px solid var(--line); border-radius: 8px;
    max-height: 240px; overflow-y: auto; display: none;
    box-shadow: 0 10px 26px rgba(0,0,0,.5);
  }
  .suggest.open { display: block; }
  .suggest .it { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; cursor: pointer; }
  .suggest .it:hover { background: rgba(245,166,35,.14); }
  .suggest .it .nm { font-weight: 600; color: var(--text); }
  .suggest .it .meta { display: flex; align-items: center; gap: 6px; }
  .suggest .it .cd { color: var(--text-faint); font-size: 12px; }
  .suggest .it .mk { font-size: 10px; color: var(--accent); border: 1px solid rgba(245,166,35,.4); border-radius: 3px; padding: 1px 4px; }
  .btn {
    height: 38px; padding: 0 18px; border: none; border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
    transition: all .15s; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-primary { background: var(--accent); color: #201503; }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 6px; }
  .btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--line); }
  .btn-ghost:hover { color: var(--text); border-color: var(--text-dim); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { filter: brightness(1.12); }
  .btn-warn { background: rgba(245,166,35,.2); color: #ffd384; border: 1px solid rgba(245,166,35,.4); }
  .btn-warn:hover { background: rgba(245,166,35,.3); }

  /* 提示条 */
  .sound-tip {
    margin-top: 10px; font-size: 11px; color: var(--text-faint);
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }

  /* 监控列表表格 */
  .table-card { padding: 0; overflow: hidden; }
  .table-responsive { width: 100%; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; text-align: left; }
  thead th {
    background: rgba(148, 173, 214, 0.04);
    color: var(--text-faint); font-weight: 500; font-size: 11px;
    padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  tbody tr {
    border-bottom: 1px solid var(--line); cursor: pointer; transition: background .15s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--panel-hover); }
  tbody tr.selected { background: rgba(245, 166, 35, 0.08); }
  tbody tr.row-triggered {
    background: linear-gradient(90deg, rgba(255, 71, 87, 0.18), rgba(245, 166, 35, 0.16)) !important;
    animation: flash-row 1.2s infinite ease-in-out;
  }
  @keyframes flash-row {
    0%, 100% { box-shadow: inset 0 0 0 rgba(255, 71, 87, 0); }
    50% { box-shadow: inset 0 0 16px rgba(255, 71, 87, 0.35); }
  }
  td { padding: 12px 14px; vertical-align: middle; white-space: nowrap; font-size: 13px; }

  /* 单元格元素 */
  .stock-name { font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 6px; }
  .stock-sub { font-size: 11px; color: var(--text-faint); margin-top: 2px; }
  .mk-tag { font-size: 10px; border-radius: 3px; padding: 1px 5px; font-weight: 500; }
  .mk-tag.a { color: #8fa3c3; background: rgba(148,173,214,.1); border: 1px solid rgba(148,173,214,.2); }
  .mk-tag.hk { color: var(--accent); background: rgba(245,166,35,.1); border: 1px solid rgba(245,166,35,.3); }

  .up { color: var(--up); }
  .down { color: var(--down); }
  .flat { color: var(--text-dim); }

  .price-cell { font-size: 14px; font-weight: 600; }
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; padding: 3px 8px; border-radius: 999px;
  }
  .badge-watching { color: #8ff0c4; background: rgba(47,209,137,.12); border: 1px solid rgba(47,209,137,.3); }
  .badge-triggered { color: #ff9f9f; background: rgba(255,71,87,.2); border: 1px solid rgba(255,71,87,.45); font-weight: 600; }
  .badge-paused { color: var(--text-faint); background: rgba(148,173,214,.08); border: 1px solid var(--line); }

  .actions-cell { display: flex; align-items: center; gap: 8px; }
  .empty-box {
    text-align: center; padding: 48px 16px; color: var(--text-faint); font-size: 13px;
  }
  .empty-box p { margin-top: 6px; font-size: 12px; color: var(--text-dim); }

  /* 分时图卡片 */
  .chart-card { display: none; margin-top: 16px; position: relative; }
  .chart-card.show { display: block; }
  .chart-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
  .chart-title { font-size: 14px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .chart-container { height: 260px; width: 100%; }
  .chart-error { height: 220px; display: flex; align-items: center; justify-content: center; color: var(--text-faint); border: 1px dashed var(--line); border-radius: 8px; }

  /* 修改目标价模态框 */
  .modal-mask {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(4, 8, 16, 0.7); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  .modal-mask.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    width: 90%; max-width: 380px; padding: 20px; box-shadow: 0 16px 40px rgba(0,0,0,.6);
  }
  .modal h3 { font-size: 15px; font-weight: 600; margin-bottom: 14px; }
  .modal .form-row { margin-bottom: 12px; }
  .modal .modal-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

  /* 吐司提示 */
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: #1c2945; border: 1px solid var(--line); color: var(--text);
    padding: 9px 18px; border-radius: 8px; font-size: 13px; z-index: 120;
    opacity: 0; transition: opacity .25s; pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  .toast.show { opacity: 1; }

  footer { margin-top: 24px; color: var(--text-faint); font-size: 11px; text-align: center; }

  @media (max-width: 820px) {
    .add-bar { grid-template-columns: 1fr 1fr; }
    .add-bar .field:first-child { grid-column: 1 / -1; }
    .add-bar .btn { grid-column: 1 / -1; }
    .chart-container { height: 210px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- 顶部标题与全局设置 -->
  <header class="head">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#16223a"/>
        <path d="M6 22 L12 15 L17 18 L26 8" stroke="#f5a623" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="26" cy="8" r="2.6" fill="#f5a623"/>
      </svg>
      <div>
        <h1>问鼎 · Ding</h1>
        <small>A股 / 港股多标的实时盯盘与到价报警</small>
      </div>
    </div>
    <div class="head-actions">
      <div class="setting-item">
        <label for="intervalSelect">刷新</label>
        <select id="intervalSelect">
          <option value="3000">3秒</option>
          <option value="5000" selected>5秒（推荐）</option>
          <option value="10000">10秒</option>
          <option value="30000">30秒</option>
        </select>
      </div>
      <div class="setting-item">
        <label for="soundSelect">音效</label>
        <select id="soundSelect">
          <option value="chime" selected>经典和弦</option>
          <option value="radar">急促雷达</option>
          <option value="bell">柔和铃声</option>
          <option value="siren">警报警笛</option>
          <option value="mute">静音模式</option>
        </select>
      </div>
      <div class="setting-item volume-group">
        <label for="volumeRange">音量 <span id="volumeVal" class="num">80%</span></label>
        <input type="range" id="volumeRange" min="0" max="100" step="5" value="80">
      </div>
      <button id="testSoundBtn" class="btn btn-ghost btn-sm" title="点击试听当前音效与音量">🔊 试听</button>
      <div id="globalPill" class="status-pill on">
        <span class="dot"></span>
        <span id="globalStatusText">监控就绪</span>
      </div>
    </div>
  </header>

  <!-- 添加新监控表单 -->
  <section class="card">
    <div class="add-bar">
      <div class="field">
        <label for="codeInput">股票代码 / 名称</label>
        <input id="codeInput" type="text" autocomplete="off" spellcheck="false"
               placeholder="输入代码或拼音，如 600519 / 00700 / 茅台">
        <div id="suggestBox" class="suggest"></div>
      </div>
      <div class="field">
        <label for="targetInput">目标价格</label>
        <input id="targetInput" type="number" min="0" step="0.01" placeholder="如 1300 或 450">
      </div>
      <div class="field">
        <label for="dirSelect">触发条件</label>
        <select id="dirSelect">
          <option value="ge">涨到 / 达到（≥）</option>
          <option value="le">跌到（≤）</option>
        </select>
      </div>
      <button id="addBtn" class="btn btn-primary">
        <span>＋</span> 添加监控
      </button>
    </div>
    <div class="sound-tip">
      <span>支持 A股（如 <code>600519</code>、<code>sz002594</code>）与港股（如 <code>00700</code>、<code>hk09988</code>）。设置自动保存在浏览器中。</span>
      <span id="audioTip" style="color: var(--accent);">提示音已就绪</span>
    </div>
  </section>

  <!-- 监控列表表格 -->
  <section class="card table-card">
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>标的名称</th>
            <th>代码</th>
            <th>现价</th>
            <th>涨跌幅</th>
            <th>目标条件</th>
            <th>距目标差值</th>
            <th>成交额</th>
            <th>状态</th>
            <th style="text-align: right; padding-right: 18px;">操作</th>
          </tr>
        </thead>
        <tbody id="monitorTbody">
          <!-- 动态渲染行 -->
        </tbody>
      </table>
    </div>
    <div id="emptyBox" class="empty-box" style="display: none;">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#5f7396" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 8px;">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <div>暂无监控标的</div>
      <p>在上方输入股票代码与目标价格，即可添加到实时盯盘队列</p>
    </div>
  </section>

  <!-- 分时走势图区域（点击任意行展开） -->
  <section class="card chart-card" id="chartCard">
    <div class="chart-head">
      <div class="chart-title">
        <span id="chartStockName">—</span>
        <span class="num" id="chartStockCode" style="color: var(--text-faint); font-size: 12px;">—</span>
        <span id="chartTargetLine" style="color: var(--accent); font-size: 12px; margin-left: 6px;">—</span>
      </div>
      <button id="closeChartBtn" class="btn btn-ghost btn-sm">收起走势图 ✕</button>
    </div>
    <div id="chartContainer" class="chart-container"></div>
    <div id="chartError" class="chart-error" style="display: none;">分时数据暂不可用</div>
  </section>

  <footer>
    行情来源：腾讯行情接口 · 仅支持 A股 与 港股 · 页面处于打开状态时持续盯盘
  </footer>
</div>

<!-- 修改目标价模态框 -->
<div class="modal-mask" id="editModal">
  <div class="modal">
    <h3 id="modalTitle">调整监控目标</h3>
    <div class="form-row field">
      <label for="editTargetInput">新的目标价格</label>
      <input id="editTargetInput" type="number" min="0" step="0.01">
    </div>
    <div class="form-row field">
      <label for="editDirSelect">触发条件</label>
      <select id="editDirSelect">
        <option value="ge">涨到 / 达到（≥）</option>
        <option value="le">跌到（≤）</option>
      </select>
    </div>
    <div class="modal-btns">
      <button id="modalCancelBtn" class="btn btn-ghost btn-sm">取消</button>
      <button id="modalSaveBtn" class="btn btn-primary btn-sm">保存并重新监控</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= 常用 A 股 / 港股搜索建议库 ================= */
const POPULAR = [
  { c: 'sh600519', n: '贵州茅台', m: 'A股' }, { c: 'sz300750', n: '宁德时代', m: 'A股' },
  { c: 'sh601318', n: '中国平安', m: 'A股' }, { c: 'sz000858', n: '五粮液', m: 'A股' },
  { c: 'sh688981', n: '中芯国际', m: 'A股' }, { c: 'sz002594', n: '比亚迪', m: 'A股' },
  { c: 'sh600036', n: '招商银行', m: 'A股' }, { c: 'sh601899', n: '紫金矿业', m: 'A股' },
  { c: 'sz300059', n: '东方财富', m: 'A股' }, { c: 'sz000001', n: '平安银行', m: 'A股' },
  { c: 'hk00700', n: '腾讯控股', m: '港股' }, { c: 'hk03690', n: '美团-W', m: '港股' },
  { c: 'hk09988', n: '阿里巴巴-W', m: '港股' }, { c: 'hk01810', n: '小米集团-W', m: '港股' },
  { c: 'hk06869', n: '长飞光纤光缆', m: '港股' }, { c: 'hk00941', n: '中国移动', m: '港股' },
  { c: 'hk01299', n: '友邦保险', m: '港股' }, { c: 'hk00883', n: '中国海洋石油', m: '港股' },
  { c: 'hk09868', n: '小鹏汽车-W', m: '港股' }, { c: 'hk02015', n: '理想汽车-W', m: '港股' }
];

/* ================= 状态管理与持久化键名 ================= */
const STORAGE_KEY = 'stock_alarm_v2_monitors';
const INTERVAL_KEY = 'stock_alarm_v2_interval';
const SOUND_TYPE_KEY = 'stock_alarm_v2_sound_type';
const SOUND_VOL_KEY = 'stock_alarm_v2_sound_vol';

let monitors = [];       // [{ id, code, target, dir, status }]
let quotes = {};         // { [code]: quoteObj }
let selectedId = null;   // 当前展示分时图的 monitorId
let timer = null;
let chartRefreshTimer = null;
let refreshInterval = 5000;
let currentSoundType = 'chime';
let currentVolume = 80;
let audioCtx = null;
let echartsLib = null;
let chartInstance = null;
let editingMonitorId = null;
let soundLoopTimer = null;

const els = {
  intervalSelect: document.getElementById('intervalSelect'),
  soundSelect: document.getElementById('soundSelect'),
  volumeRange: document.getElementById('volumeRange'),
  volumeVal: document.getElementById('volumeVal'),
  testSoundBtn: document.getElementById('testSoundBtn'),
  globalPill: document.getElementById('globalPill'),
  globalStatusText: document.getElementById('globalStatusText'),
  codeInput: document.getElementById('codeInput'),
  targetInput: document.getElementById('targetInput'),
  dirSelect: document.getElementById('dirSelect'),
  addBtn: document.getElementById('addBtn'),
  suggestBox: document.getElementById('suggestBox'),
  monitorTbody: document.getElementById('monitorTbody'),
  emptyBox: document.getElementById('emptyBox'),
  chartCard: document.getElementById('chartCard'),
  chartStockName: document.getElementById('chartStockName'),
  chartStockCode: document.getElementById('chartStockCode'),
  chartTargetLine: document.getElementById('chartTargetLine'),
  chartContainer: document.getElementById('chartContainer'),
  chartError: document.getElementById('chartError'),
  closeChartBtn: document.getElementById('closeChartBtn'),
  audioTip: document.getElementById('audioTip'),
  toast: document.getElementById('toast'),
  editModal: document.getElementById('editModal'),
  modalTitle: document.getElementById('modalTitle'),
  editTargetInput: document.getElementById('editTargetInput'),
  editDirSelect: document.getElementById('editDirSelect'),
  modalCancelBtn: document.getElementById('modalCancelBtn'),
  modalSaveBtn: document.getElementById('modalSaveBtn')
};

/* ================= 代码规范化（仅支持 A 股 / 港股） ================= */
function normalizeCode(raw) {
  let s = (raw || '').trim().toLowerCase().replace(/[.\s]/g, '');
  if (!s) return '';
  if (/^(sh|sz|bj)\d{6}$/.test(s)) return s;
  if (/^hk\d{5}$/.test(s)) return s;
  if (/^\d{5}$/.test(s)) return 'hk' + s;
  if (/^\d{6}$/.test(s)) {
    if (/^[68]/.test(s)) {
      if (/^8[2378]/.test(s)) return 'bj' + s;
      return 'sh' + s;
    }
    if (/^[03]/.test(s)) return 'sz' + s;
    if (/^[49]/.test(s)) return 'bj' + s;
    return 'sh' + s;
  }
  return '';
}

function marketNameOf(code) {
  if (/^hk/.test(code)) return '港股';
  return 'A股';
}

function fmt(n, d) {
  if (n == null || isNaN(n)) return '--';
  return Number(n).toFixed(d);
}

function fmtBig(n) {
  if (n == null || isNaN(n)) return '--';
  const abs = Math.abs(n);
  if (abs >= 1e8) return (n / 1e8).toFixed(2) + '亿';
  if (abs >= 1e4) return (n / 1e4).toFixed(2) + '万';
  return String(Math.round(n));
}

function toast(msg) {
  els.toast.textContent = msg;
  els.toast.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => els.toast.classList.remove('show'), 2400);
}

/* ================= 声音管理与多种合成音效 ================= */
function ensureAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    els.audioTip.textContent = '提示音已就绪';
    els.audioTip.style.color = 'var(--ok)';
    return true;
  } catch (e) {
    els.audioTip.textContent = '浏览器限制提示音，请点击页面激活';
    els.audioTip.style.color = 'var(--accent)';
    return false;
  }
}

function playAlarmSound(type = currentSoundType, vol = currentVolume) {
  if (type === 'mute' || vol <= 0) return;
  if (!ensureAudio() || audioCtx.state !== 'running') return;

  const ctx = audioCtx;
  const now = ctx.currentTime;
  const gainScale = (vol / 100);

  if (type === 'chime') {
    // 经典和弦：A5(880) -> C6(1046) -> E6(1318)
    const melody = [880, 1046, 1318];
    melody.forEach((f, i) => {
      const t = now + i * 0.16;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.35 * gainScale, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.16);
    });
  } else if (type === 'radar') {
    // 急促雷达：1200Hz 快速双击
    [0, 0.13].forEach(offset => {
      const t = now + offset;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = 1200;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.22 * gainScale, t + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.09);
    });
  } else if (type === 'bell') {
    // 柔和铃声：正弦波 660Hz 自然衰减
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 660;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.48 * gainScale, now + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.48);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.5);
  } else if (type === 'siren') {
    // 警报警笛：700Hz 滑升到 1100Hz 再降回 700Hz
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(700, now);
    osc.frequency.linearRampToValueAtTime(1100, now + 0.18);
    osc.frequency.linearRampToValueAtTime(700, now + 0.36);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.26 * gainScale, now + 0.03);
    gain.gain.setValueAtTime(0.26 * gainScale, now + 0.32);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.42);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.44);
  }
}

function syncSoundAlarm() {
  const hasTriggered = monitors.some(m => m.status === 'triggered');
  if (hasTriggered && currentSoundType !== 'mute' && currentVolume > 0) {
    if (!soundLoopTimer) {
      playAlarmSound();
      soundLoopTimer = setInterval(() => playAlarmSound(), 3500);
    }
  } else {
    if (soundLoopTimer) {
      clearInterval(soundLoopTimer);
      soundLoopTimer = null;
    }
  }
}

/* ================= 批量行情获取（JSONP） ================= */
function fetchBatchQuotes(codes) {
  if (!codes || !codes.length) return Promise.resolve({});
  return new Promise((resolve) => {
    const s = document.createElement('script');
    const param = codes.join(',');
    const done = () => {
      s.onload = s.onerror = null;
      s.remove();
      const res = {};
      codes.forEach(c => {
        const raw = window['v_' + c];
        if (typeof raw === 'string' && raw.length > 10) {
          const parsed = parseQuote(c, raw);
          if (parsed) res[c] = parsed;
        }
      });
      resolve(res);
    };
    s.onload = done;
    s.onerror = () => {
      s.onerror = null;
      s.remove();
      resolve({});
    };
    s.src = 'https://qt.gtimg.cn/q=' + param + '&_=' + Date.now();
    document.head.appendChild(s);
  });
}

function parseQuote(code, raw) {
  const s = String(raw);
  const eq = s.indexOf('="');
  const body = eq >= 0 ? s.slice(eq + 2, s.lastIndexOf('"')) : s;
  const f = body.split('~');
  if (f.length < 35 || !f[1]) return null;
  const isA = /^sh|^sz|^bj/.test(code);
  let vol = +f[36];
  let amt = isA ? (+f[37] * 10000) : (+f[37]);
  return {
    name: f[1],
    code: code,
    price: +f[3],
    prevClose: +f[4],
    open: +f[5],
    change: +f[31],
    changePct: +f[32],
    high: +f[33],
    low: +f[34],
    vol: vol,
    amt: amt,
    isA: isA,
    decimals: isA ? 2 : 3
  };
}

/* ================= 分时图加载与渲染 ================= */
function loadChartLib() {
  return new Promise((resolve, reject) => {
    if (window.echarts) return resolve(window.echarts);
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js';
    s.onload = () => window.echarts ? resolve(window.echarts) : reject(new Error('lib'));
    s.onerror = () => {
      const s2 = document.createElement('script');
      s2.src = 'https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.1/echarts.min.js';
      s2.onload = () => window.echarts ? resolve(window.echarts) : reject(new Error('lib'));
      s2.onerror = () => reject(new Error('lib'));
      document.head.appendChild(s2);
    };
    document.head.appendChild(s);
  });
}

async function renderSelectedChart() {
  if (!selectedId) {
    els.chartCard.classList.remove('show');
    return;
  }
  const item = monitors.find(m => m.id === selectedId);
  if (!item) {
    els.chartCard.classList.remove('show');
    selectedId = null;
    return;
  }
  const q = quotes[item.code];
  els.chartStockName.textContent = q ? q.name : item.code;
  els.chartStockCode.textContent = item.code;
  const cmpText = item.dir === 'ge' ? '≥' : '≤';
  els.chartTargetLine.textContent = '监控条件: ' + cmpText + ' ' + item.target;
  els.chartCard.classList.add('show');

  try {
    const r = await fetch('https://web.ifzq.gtimg.cn/appstock/app/minute/query?code=' + item.code);
    const j = await r.json();
    const node = j.data && j.data[item.code];
    if (!node || !node.data || !node.data.data || !node.data.data.length) throw new Error('empty');
    const rows = [];
    node.data.data.forEach(x => {
      const p = String(x).split(' ');
      if (p.length >= 2 && p[0].length >= 4) {

          t: p[0].slice(0, 2) + ':' + p[0].slice(2, 4),

    });

    els.chartError.style.display = 'none';
    els.chartContainer.style.display = 'block';
    const echarts = await loadChartLib();
    if (!chartInstance) chartInstance = echarts.init(els.chartContainer);

    const prev = q ? q.prevClose : null;
    const markData = [
      {
        yAxis: item.target,
        name: '目标 ' + item.target,
        lineStyle: { color: '#f5a623', type: 'dashed', width: 1.5 },
        label: { color: '#ffd98a', position: 'insideEndTop', formatter: '目标 ' + item.target }
      }
    ];

      markData.push({
        yAxis: prev,
        name: '昨收 ' + prev,
        lineStyle: { color: 'rgba(143,163,195,.5)', type: 'dashed', width: 1 },
        label: { color: '#8fa3c3', position: 'insideStartTop', formatter: '昨收 ' + prev }
      });
    }

    chartInstance.setOption({
      backgroundColor: 'transparent',
      animation: false,
      grid: { left: 14, right: 14, top: 28, bottom: 8, containLabel: true },
      tooltip: {
        trigger: 'axis',
        backgroundColor: '#0e1830',
        borderColor: 'rgba(148,173,214,.25)',
        textStyle: { color: '#e8eefb', fontSize: 12 },
        formatter: p => {
          const it = p[0];
          return it.axisValue + '<br/>现价 <b>' + it.value.toFixed(q ? q.decimals : 2) + '</b>' +
            (prev != null ? '<br/>昨收 ' + prev.toFixed(q ? q.decimals : 2) : '');
        }
      },
      xAxis: {
        type: 'category',
        data: rows.map(r => r.t),
        boundaryGap: false,
        axisLine: { lineStyle: { color: 'rgba(148,173,214,.2)' } },
        axisLabel: { color: '#5f7396', fontSize: 10, interval: Math.max(1, Math.floor(rows.length / 6) - 1) },
        axisTick: { show: false }
      },
      yAxis: {
        type: 'value',

      },

        data: rows.map(r => r.p),
        smooth: true,
        symbol: 'none',
        lineStyle: { width: 2, color: '#f5a623' },

            colorStops: [

              { offset: 1, color: 'rgba(245,166,35,.02)' }
            ]
          }
        },
        markLine: {
          symbol: 'none',
          silent: true,

        }
      }]
    }, true);
  } catch (e) {
    els.chartContainer.style.display = 'none';
    els.chartError.style.display = 'flex';
  }
}

/* ================= 轮询与核心提醒触发 ================= */
async function pollCycle() {
  if (!monitors.length) {
    updateGlobalStatus();
    renderTable();
    return;
  }
  const codeList = Array.from(new Set(monitors.map(m => m.code)));
  const latest = await fetchBatchQuotes(codeList);
  Object.assign(quotes, latest);

  let newlyTriggeredCount = 0;

  monitors.forEach(item => {
    const q = quotes[item.code];
    if (!q) return;
    if (item.status === 'watching') {
      const hit = item.dir === 'ge' ? q.price >= item.target : q.price <= item.target;
      if (hit) {
        item.status = 'triggered';
        newlyTriggeredCount++;
        if ('Notification' in window && Notification.permission === 'granted') {
          try {
            const dirDesc = item.dir === 'ge' ? '涨到 / 达到' : '跌到';
            new Notification('股价到价警报 · ' + q.name, {
              body: q.name + ' 现价 ' + fmt(q.price, q.decimals) + '，已满足条件（' + dirDesc + ' ' + item.target + '）'
            });
          } catch (e) {}
        }
      }
    }
  });

  if (newlyTriggeredCount > 0) {
    saveMonitors();
    playAlarmSound();
  }

  syncSoundAlarm();
  updateGlobalStatus();
  renderTable();

  if (selectedId) {
    renderSelectedChart();
  }
}

function updateGlobalStatus() {
  const triggeredCount = monitors.filter(m => m.status === 'triggered').length;
  const watchingCount = monitors.filter(m => m.status === 'watching').length;
  const pill = els.globalPill;
  const text = els.globalStatusText;

  if (triggeredCount > 0) {
    pill.className = 'status-pill triggered';
    text.textContent = triggeredCount + ' 只标的已触发警报';
  } else if (watchingCount > 0) {
    pill.className = 'status-pill on';
    text.textContent = '监控中 ' + watchingCount + ' 只标的';
  } else {
    pill.className = 'status-pill';
    text.textContent = '未启动监控';
  }
}

/* ================= 列表渲染 ================= */
function renderTable() {
  const tbody = els.monitorTbody;
  if (!monitors.length) {
    tbody.innerHTML = '';
    els.emptyBox.style.display = 'block';
    return;
  }
  els.emptyBox.style.display = 'none';

  tbody.innerHTML = monitors.map(item => {
    const q = quotes[item.code];
    const isSelected = item.id === selectedId;
    const isTriggered = item.status === 'triggered';
    const rowClass = [
      isSelected ? 'selected' : '',
      isTriggered ? 'row-triggered' : ''
    ].filter(Boolean).join(' ');

    const mk = marketNameOf(item.code);
    const mkClass = mk === 'A股' ? 'a' : 'hk';
    const decimals = q ? q.decimals : (/^hk/.test(item.code) ? 3 : 2);

    let priceHtml = '--';
    let chgHtml = '--';
    let amtHtml = '--';
    let distHtml = '--';

    if (q) {
      const colorClass = q.change > 0 ? 'up' : q.change < 0 ? 'down' : 'flat';
      const sign = q.change > 0 ? '+' : '';
      priceHtml = '<span class="price-cell num ' + colorClass + '">' + fmt(q.price, decimals) + '</span>';
      chgHtml = '<span class="num ' + colorClass + '">' + sign + fmt(q.change, decimals) + ' (' + sign + fmt(q.changePct, 2) + '%)</span>';
      amtHtml = '<span class="num" style="font-size:12px; color:var(--text-dim);">' + fmtBig(q.amt) + '</span>';

      const diff = q.price - item.target;
      const hit = item.dir === 'ge' ? diff >= 0 : diff <= 0;
      const distColor = hit ? 'up' : 'flat';
      distHtml = '<span class="num ' + distColor + '">' + (diff > 0 ? '+' : '') + fmt(diff, decimals) + '</span>';
    }

    let statusBadge = '';
    if (item.status === 'triggered') {
      statusBadge = '<span class="badge badge-triggered">⚠ 到价已触发</span>';
    } else if (item.status === 'watching') {
      statusBadge = '<span class="badge badge-watching">监控中</span>';
    } else {
      statusBadge = '<span class="badge badge-paused">已暂停</span>';
    }

    const condText = (item.dir === 'ge' ? '≥ ' : '≤ ') + item.target;

    let actionsHtml = '';
    if (item.status === 'triggered') {
      actionsHtml = '<button class="btn btn-danger btn-sm" onclick="event.stopPropagation(); stopAlarmItem(\'' + item.id + '\')">停止提醒</button>';
    } else if (item.status === 'paused') {
      actionsHtml =
        '<button class="btn btn-warn btn-sm" onclick="event.stopPropagation(); resumeItem(\'' + item.id + '\')">重新监控</button>' +
        '<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); openEditModal(\'' + item.id + '\')">改价</button>' +
        '<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); removeItem(\'' + item.id + '\')">删除</button>';
    } else {
      actionsHtml =
        '<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); pauseItem(\'' + item.id + '\')">暂停</button>' +
        '<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); openEditModal(\'' + item.id + '\')">改价</button>' +
        '<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); removeItem(\'' + item.id + '\')">删除</button>';
    }

    return '<tr class="' + rowClass + '" onclick="toggleSelectRow(\'' + item.id + '\')">' +
      '<td>' +
        '<div class="stock-name">' + (q ? q.name : item.code) + '</div>' +
        '<div class="stock-sub"><span class="mk-tag ' + mkClass + '">' + mk + '</span> ' + item.code + '</div>' +
      '</td>' +
      '<td class="num">' + item.code + '</td>' +
      '<td>' + priceHtml + '</td>' +
      '<td>' + chgHtml + '</td>' +
      '<td class="num" style="font-weight: 600; color: var(--accent);">' + condText + '</td>' +
      '<td>' + distHtml + '</td>' +
      '<td>' + amtHtml + '</td>' +
      '<td>' + statusBadge + '</td>' +
      '<td style="text-align: right; padding-right: 18px;">' +
        '<div class="actions-cell" style="justify-content: flex-end;">' + actionsHtml + '</div>' +
      '</td>' +
    '</tr>';
  }).join('');
}

/* ================= 业务操作方法 ================= */
function addMonitor() {
  const raw = els.codeInput.value.trim();
  const code = normalizeCode(raw);
  const target = parseFloat(els.targetInput.value);
  const dir = els.dirSelect.value;

  if (!raw) {
    toast('请输入股票代码或名称');
    els.codeInput.focus();
    return;
  }
  if (!code) {
    toast('仅支持 A股（如 600519）与港股（如 00700）代码');
    return;
  }
  if (isNaN(target) || target <= 0) {
    toast('请输入有效的目标价格');
    els.targetInput.focus();
    return;
  }

  const existing = monitors.find(m => m.code === code && m.target === target && m.dir === dir);
  if (existing) {
    toast('已存在完全相同的监控项');
    return;
  }

  const newItem = {
    id: 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    code: code,
    target: target,
    dir: dir,
    status: 'watching'
  };

  monitors.unshift(newItem);
  saveMonitors();
  els.codeInput.value = '';
  els.targetInput.value = '';
  els.suggestBox.classList.remove('open');
  ensureAudio();

  if ('Notification' in window && Notification.permission === 'default') {
    try { Notification.requestPermission(); } catch (e) {}
  }

  toast('已添加 ' + code + ' 到实时监控');
  pollCycle();
}

function stopAlarmItem(id) {
  const it = monitors.find(m => m.id === id);
  if (!it) return;
  it.status = 'paused';
  saveMonitors();
  syncSoundAlarm();
  updateGlobalStatus();
  renderTable();
  toast('已停止提醒，可就地修改目标价或重新监控');
}

function pauseItem(id) {
  const it = monitors.find(m => m.id === id);
  if (!it) return;
  it.status = 'paused';
  saveMonitors();
  syncSoundAlarm();
  updateGlobalStatus();
  renderTable();
  toast('已暂停监控 ' + it.code);
}

function resumeItem(id) {
  const it = monitors.find(m => m.id === id);
  if (!it) return;
  it.status = 'watching';
  saveMonitors();
  syncSoundAlarm();
  updateGlobalStatus();
  renderTable();
  toast('已恢复监控 ' + it.code);
}

function removeItem(id) {
  const idx = monitors.findIndex(m => m.id === id);
  if (idx < 0) return;
  const removedCode = monitors[idx].code;
  monitors.splice(idx, 1);
  if (selectedId === id) {
    selectedId = null;
    els.chartCard.classList.remove('show');
  }
  saveMonitors();
  syncSoundAlarm();
  updateGlobalStatus();
  renderTable();
  toast('已移除监控项 ' + removedCode);
}

function toggleSelectRow(id) {
  if (selectedId === id) {
    selectedId = null;
    els.chartCard.classList.remove('show');
  } else {
    selectedId = id;
    renderSelectedChart();
  }
  renderTable();
}

/* ================= 目标价格修改模态框 ================= */
function openEditModal(id) {
  const it = monitors.find(m => m.id === id);
  if (!it) return;
  editingMonitorId = id;
  const q = quotes[it.code];
  els.modalTitle.textContent = '调整 ' + (q ? q.name : it.code) + ' 监控目标';
  els.editTargetInput.value = it.target;
  els.editDirSelect.value = it.dir;
  els.editModal.classList.add('open');
  els.editTargetInput.focus();
}

function closeEditModal() {
  editingMonitorId = null;
  els.editModal.classList.remove('open');
}

function saveEditModal() {
  if (!editingMonitorId) return;
  const it = monitors.find(m => m.id === editingMonitorId);
  if (!it) return;
  const newTarget = parseFloat(els.editTargetInput.value);
  if (isNaN(newTarget) || newTarget <= 0) {
    toast('请输入有效的目标价格');
    return;
  }
  it.target = newTarget;
  it.dir = els.editDirSelect.value;
  it.status = 'watching';
  saveMonitors();
  closeEditModal();
  syncSoundAlarm();
  updateGlobalStatus();
  renderTable();
  if (selectedId === it.id) renderSelectedChart();
  toast('已更新监控目标并重新开始监控');
}

/* ================= 搜索建议联想 ================= */
function renderSuggest(query) {
  const q = query.trim().toLowerCase();
  const box = els.suggestBox;
  if (!q) { box.classList.remove('open'); return; }
  const hits = POPULAR.filter(x => x.c.includes(q) || x.n.toLowerCase().includes(q)).slice(0, 8);
  if (!hits.length) {
    box.innerHTML = '<div style="padding:10px 12px; color:var(--text-faint); font-size:12px;">直接输入任意A股或港股代码（如 600519 / 00700）</div>';
    box.classList.add('open');
    return;
  }
  box.innerHTML = hits.map(x =>
    '<div class="it" data-c="' + x.c + '" data-n="' + x.n + '">' +
      '<span class="nm">' + x.n + '</span>' +
      '<div class="meta"><span class="cd num">' + x.c + '</span><span class="mk">' + x.m + '</span></div>' +
    '</div>'
  ).join('');
  box.classList.add('open');
}

/* ================= 持久化读写 ================= */
function saveMonitors() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(monitors));
  } catch (e) {}
}

function loadMonitors() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      monitors = JSON.parse(raw);
    } else {
      monitors = [];
    }
  } catch (e) {
    monitors = [];
  }
}

function saveInterval(val) {
  try {
    localStorage.setItem(INTERVAL_KEY, String(val));
  } catch (e) {}
}

function loadInterval() {
  try {
    const raw = localStorage.getItem(INTERVAL_KEY);
    if (raw && !isNaN(+raw)) {
      refreshInterval = +raw;
      els.intervalSelect.value = String(refreshInterval);
    }
  } catch (e) {}
}

function saveSoundSettings() {
  try {
    localStorage.setItem(SOUND_TYPE_KEY, currentSoundType);
    localStorage.setItem(SOUND_VOL_KEY, String(currentVolume));
  } catch (e) {}
}

function loadSoundSettings() {
  try {
    const st = localStorage.getItem(SOUND_TYPE_KEY);
    if (st) {
      currentSoundType = st;
      els.soundSelect.value = st;
    }
    const sv = localStorage.getItem(SOUND_VOL_KEY);
    if (sv && !isNaN(+sv)) {
      currentVolume = parseInt(sv, 10);
      els.volumeRange.value = String(currentVolume);
      els.volumeVal.textContent = currentVolume + '%';
    }
  } catch (e) {}
}

function restartTimer() {
  clearInterval(timer);
  timer = setInterval(pollCycle, refreshInterval);
}

/* ================= 事件监听绑定 ================= */
els.addBtn.addEventListener('click', addMonitor);
els.codeInput.addEventListener('input', () => renderSuggest(els.codeInput.value));
els.codeInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    els.suggestBox.classList.remove('open');
    addMonitor();
  }
  if (e.key === 'Escape') els.suggestBox.classList.remove('open');
});
els.suggestBox.addEventListener('mousedown', e => {
  const it = e.target.closest('.it');
  if (it) {
    e.preventDefault();
    els.codeInput.value = it.dataset.c;
    els.suggestBox.classList.remove('open');
    els.targetInput.focus();
  }
});

document.addEventListener('click', e => {
  if (!e.target.closest('.field')) els.suggestBox.classList.remove('open');
  ensureAudio();
});

els.intervalSelect.addEventListener('change', () => {
  refreshInterval = parseInt(els.intervalSelect.value, 10);
  saveInterval(refreshInterval);
  restartTimer();
  toast('已切换刷新频率为 ' + (refreshInterval / 1000) + ' 秒');
});

/* 音效与音量事件 */
els.soundSelect.addEventListener('change', () => {
  currentSoundType = els.soundSelect.value;
  saveSoundSettings();
  if (currentSoundType !== 'mute') {
    playAlarmSound(currentSoundType, currentVolume);
  }
  toast('已切换音效为：' + els.soundSelect.options[els.soundSelect.selectedIndex].text);
});

els.volumeRange.addEventListener('input', () => {
  currentVolume = parseInt(els.volumeRange.value, 10);
  els.volumeVal.textContent = currentVolume + '%';
});

els.volumeRange.addEventListener('change', () => {
  currentVolume = parseInt(els.volumeRange.value, 10);
  saveSoundSettings();
  if (currentSoundType !== 'mute' && currentVolume > 0) {
    playAlarmSound(currentSoundType, currentVolume);
  }
});

els.testSoundBtn.addEventListener('click', () => {
  ensureAudio();
  if (currentSoundType === 'mute') {
    toast('当前处于静音模式，无发声');
    return;
  }
  if (currentVolume <= 0) {
    toast('当前音量为 0%');
    return;
  }
  playAlarmSound(currentSoundType, currentVolume);
  toast('试听：' + els.soundSelect.options[els.soundSelect.selectedIndex].text + ' · 音量 ' + currentVolume + '%');
});

els.closeChartBtn.addEventListener('click', () => {
  selectedId = null;
  els.chartCard.classList.remove('show');
  renderTable();
});

els.modalCancelBtn.addEventListener('click', closeEditModal);
els.modalSaveBtn.addEventListener('click', saveEditModal);
els.editModal.addEventListener('click', e => {
  if (e.target === els.editModal) closeEditModal();
});
window.addEventListener('resize', () => {
  if (chartInstance) chartInstance.resize();
});

/* ================= 页面初始化启动 ================= */
(function init() {
  loadInterval();
  loadSoundSettings();
  loadMonitors();
  updateGlobalStatus();
  renderTable();
  restartTimer();
  pollCycle();
  chartRefreshTimer = setInterval(() => {
    if (selectedId) renderSelectedChart();
  }, 60000);
})();
</script>
</body>
</html>
